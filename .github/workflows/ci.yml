name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'backend -> target'
      - name: cargo check
        working-directory: backend
        run: cargo check --all-targets
      - name: cargo test
        working-directory: backend
        run: cargo test

  frontend:
    name: Frontend (astro check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run build

  desktop:
    name: Desktop (tsc + vite + cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libudev-dev
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run build
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test
