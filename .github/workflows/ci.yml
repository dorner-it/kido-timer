name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: kido-core (fmt + clippy + test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates/kido-core -> target'
      - working-directory: crates/kido-core
        run: cargo fmt --check
      - working-directory: crates/kido-core
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: crates/kido-core
        run: cargo test

  backend:
    name: Backend (cargo test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'backend -> target'
      - name: cargo check
        working-directory: backend
        run: cargo check --all-targets
      - name: cargo test
        working-directory: backend
        run: cargo test

  frontend-tests:
    name: Frontend (vitest)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test

  frontend:
    name: Frontend (astro check + build)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run build:judge

  desktop:
    name: Desktop (judge build + tsc + vite + cargo fmt/clippy/test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      # The on-prem judge UI is embedded into the desktop binary at compile
      # time (desktop/src-tauri/build.rs) — build it first.
      - name: Build judge UI (frontend/dist-judge)
        working-directory: frontend
        run: |
          npm ci
          npm run build:judge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libudev-dev
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run build
      - working-directory: desktop
        run: npm test
      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test
